name: Offline source rebuild

on:
  workflow_call:
    inputs:
      artifact_id:
        required: true
        type: string
      archive_sha256:
        required: true
        type: string
      same_workspace_path:
        default: true
        required: false
        type: boolean
  workflow_dispatch:
    inputs:
      artifact_id:
        description: Source-review artifact ID from this repository
        required: true
        type: string
      archive_sha256:
        description: Independently verified SHA-256 of that source ZIP
        required: true
        type: string
      same_workspace_path:
        default: true
        description: Relocate the verified source tree to the normal online openwrt-src path
        required: false
        type: boolean

permissions:
  contents: read
  actions: read

concurrency:
  group: ls420d-offline-source-${{ github.ref }}
  cancel-in-progress: true

jobs:
  offline-rebuild:
    if: github.event.repository.visibility == 'public'
    runs-on: ubuntu-24.04
    timeout-minutes: 240
    steps:
      - uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6
        with:
          persist-credentials: false
      - name: Install build dependencies
        run: |
          sudo apt-get update
          sudo apt-get install --yes --no-install-recommends \
            build-essential clang flex bison g++ gawk gcc-multilib \
            g++-multilib device-tree-compiler gettext git libelf-dev \
            libncurses-dev libssl-dev libzstd-dev python3 python3-pyelftools \
            python3-setuptools rsync swig unzip zlib1g-dev file wget xz-utils \
            iproute2 util-linux
          sudo apt-get clean
      - name: Download the explicitly pinned source artifact
        env:
          GH_TOKEN: ${{ github.token }}
          SOURCE_ARTIFACT_ID: ${{ inputs.artifact_id }}
          SOURCE_ARCHIVE_SHA256: ${{ inputs.archive_sha256 }}
        run: |
          [[ "$SOURCE_ARTIFACT_ID" =~ ^[0-9]+$ ]]
          [[ "$SOURCE_ARCHIVE_SHA256" =~ ^[0-9a-f]{64}$ ]]
          gh api "repos/$GITHUB_REPOSITORY/actions/artifacts/$SOURCE_ARTIFACT_ID" \
            --jq '.expired == false' | grep -qx true
          gh api "repos/$GITHUB_REPOSITORY/actions/artifacts/$SOURCE_ARTIFACT_ID/zip" \
            > "$RUNNER_TEMP/source-review.zip"
      - name: Verify hashes and restore source trees
        env:
          SOURCE_ARCHIVE_SHA256: ${{ inputs.archive_sha256 }}
        run: |
          python3 scripts/restore-source-review.py "$RUNNER_TEMP/source-review.zip" \
            --sha256 "$SOURCE_ARCHIVE_SHA256" --output "$RUNNER_TEMP/offline-source"
      - name: Select the controlled source location
        env:
          SAME_WORKSPACE_PATH: ${{ inputs.same_workspace_path }}
        run: |
          source_dir="$RUNNER_TEMP/offline-source/openwrt"
          test -d "$source_dir"
          test ! -L "$source_dir"
          if [ "$SAME_WORKSPACE_PATH" = true ]; then
            destination="$GITHUB_WORKSPACE/openwrt-src"
            test ! -e "$destination"
            test ! -L "$destination"
            mv -T -- "$source_dir" "$destination"
            printf 'OFFLINE_SOURCE_OVERRIDE=%s\n' "$destination" >> "$GITHUB_ENV"
          fi
      - name: Rebuild with no network or compiler cache
        run: |
          sudo unshare --net -- sh -eu -c '
            ip link set lo up
            exec runuser -u "$1" -- env PATH="$4" GITHUB_WORKSPACE="$5" \
              OPENWRT_SOURCE_DIR="$6" OFFLINE_RESTORED_SOURCE_DIR="$3/openwrt" JOBS=4 \
              sh "$2" "$3"
          ' sh "$(id -un)" "$GITHUB_WORKSPACE/scripts/rebuild-offline.sh" "$RUNNER_TEMP/offline-source" "$PATH" \
            "$GITHUB_WORKSPACE" "${OFFLINE_SOURCE_OVERRIDE:-}"
      - name: Upload offline verification report (no firmware)
        if: success() || failure()
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4.6.2
        with:
          name: ls420d-offline-result-${{ github.run_id }}
          path: |
            ${{ runner.temp }}/offline-source/offline-result.json
            ${{ runner.temp }}/offline-source/offline-config-result.json
            ${{ runner.temp }}/offline-source/offline-rootfs-inventory.json
          if-no-files-found: warn
          retention-days: 14
      - name: Report final disk usage
        if: always()
        run: df -h .
