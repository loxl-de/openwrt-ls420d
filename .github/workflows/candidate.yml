name: Retain candidate as draft

on:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ls420d-draft-candidate
  cancel-in-progress: false

jobs:
  candidate:
    # Reviewed default-branch code only; never pull-request or arbitrary-ref code.
    if: github.repository == 'loxl-de/openwrt-ls420d' && github.ref == 'refs/heads/main'
    runs-on: ubuntu-24.04
    timeout-minutes: 240
    permissions:
      contents: write
    env:
      ARTIFACT_DIR: ${{ github.workspace }}/build/artifacts
      OPENWRT_DOWNLOAD_DIR: ${{ github.workspace }}/build/dl
      OPENWRT_CCACHE_DIR: ${{ github.workspace }}/build/ccache
      CCACHE_DISABLE: '1'
      JOBS: '4'
      CANDIDATE_TAG: candidate-${{ github.sha }}-${{ github.run_id }}-${{ github.run_attempt }}
    steps:
      - name: Check out reviewed commit
        uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6
        with:
          fetch-depth: 0
          persist-credentials: false
      - name: Verify release access before compiling
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -eu
          test "$(gh api "repos/$GITHUB_REPOSITORY" --jq .default_branch)" = main
          test "$(git rev-parse HEAD)" = "$GITHUB_SHA"
          gh release create "$CANDIDATE_TAG" --repo "$GITHUB_REPOSITORY" \
            --target "$GITHUB_SHA" --draft --prerelease \
            --title "LS420D candidate $GITHUB_SHA" \
            --notes "Unpublished build candidate. Hardware validation and public distribution approval are pending. A failed build may leave an empty draft."
      - name: Install build and test dependencies
        run: |
          sudo apt-get update
          sudo apt-get install --yes --no-install-recommends \
            build-essential ccache clang flex bison g++ gawk gcc-multilib \
            g++-multilib device-tree-compiler gettext git libelf-dev \
            libncurses-dev libssl-dev libzstd-dev python3 python3-pyelftools \
            python3-setuptools rsync swig unzip zlib1g-dev file wget xz-utils \
            zstd busybox shellcheck
          sudo apt-get clean
      - name: Check sources before compiling
        run: |
          set -eu
          sh scripts/install-gitleaks.sh "$RUNNER_TEMP/ls420d-gitleaks"
          export GITLEAKS="$RUNNER_TEMP/ls420d-gitleaks/gitleaks"
          sh scripts/scan-secrets.sh
          python3 -m unittest discover -s tests -p 'test_*.py' -q
          sh tests/test-scripts.sh
          sh scripts/audit-public-tree.sh
          git diff --check
      - name: Restore downloaded sources
        uses: actions/cache@0400d5f644dc74513175e3cd8d07132dd4860809 # v4.2.4
        with:
          path: build/dl
          key: ${{ runner.os }}-ls420d-draft-dl-${{ hashFiles('openwrt.lock', 'feeds.lock', 'config/ls420d.config') }}
      - name: Build the generic image and example companion
        run: ./scripts/build.sh
      - name: Record runner provenance
        run: |
          {
            printf 'ImageOS=%s\n' "${ImageOS:-unknown}"
            printf 'ImageVersion=%s\n' "${ImageVersion:-unknown}"
            uname -a
            nproc
            free -h
            df -h .
          } > "$ARTIFACT_DIR/runner.txt"
      - name: Collect corresponding source inputs and original notices
        run: |
          python3 scripts/collect-source-review.py \
            --source openwrt-src --downloads build/dl \
            --artifacts build/artifacts --notice-selection config/notice-files.json \
            --output build/source-review
      - name: Package verified source and binary assets together
        run: |
          python3 scripts/package-release-candidate.py \
            --artifacts build/artifacts --sources build/source-review \
            --output build/release
      - name: Retain assets without publishing the draft
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -eu
          test "$(gh release view "$CANDIDATE_TAG" --repo "$GITHUB_REPOSITORY" --json isDraft --jq .isDraft)" = true
          # Finish source uploads before sending any firmware bytes.
          gh release upload "$CANDIDATE_TAG" --repo "$GITHUB_REPOSITORY" \
            build/release/sources.tar build/release/THIRD-PARTY-NOTICES.tar \
            build/release/build.manifest build/release/packages.manifest
          test "$(gh release view "$CANDIDATE_TAG" --repo "$GITHUB_REPOSITORY" --json isDraft --jq .isDraft)" = true
          gh release upload "$CANDIDATE_TAG" --repo "$GITHUB_REPOSITORY" \
            build/release/uImage.buffalo build/release/initrd.buffalo \
            build/release/SHA256SUMS
          test "$(gh release view "$CANDIDATE_TAG" --repo "$GITHUB_REPOSITORY" --json isDraft --jq .isDraft)" = true
